# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    # The application always reads the connection string from DATABASE_URL.
    # In CI this comes from the repository secret (set it to the Supabase URL).
    # Never hard-code a connection string or use localhost:5432 here.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Verify database connection (Supabase)
        # Skipped on fork PRs, where repository secrets are not available.
        if: ${{ env.DATABASE_URL != '' }}
        run: |
          python -c "
          import sys
          from db.connection import check_database_connection
          ok, msg = check_database_connection()
          print('Database connection OK' if ok else 'Database connection FAILED')
          sys.exit(0 if ok else 1)
          "

      - name: Lint with flake8
        run: flake8 .

      - name: Type check with mypy
        run: mypy .

      - name: Security scan with bandit (medium severity and above)
        run: bandit -r api db etl ingestion ml reports scripts ./*.py -ll

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: docker build -t sales-analytics-platform:ci .

      - name: Smoke-test the container (boots and answers /health)
        # No database is attached, so /health must answer 200 with status "degraded".
        # This proves gunicorn starts and the app imports inside the image.
        run: |
          docker run -d --name smoke -p 8000:8000 sales-analytics-platform:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 2
          done
          echo "Container did not become healthy"; docker logs smoke; exit 1

  publish-image:
    # Only publish from main, after everything above passed.
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          # Image names must be lowercase; the repository owner is not.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}" .
          docker push --all-tags "$IMAGE"
