name: Weekly Sales Analytics Report

on:
  # Every Monday 09:00 IST (03:30 UTC)
  schedule:
    - cron: "30 3 * * 1"
  # Manual run from the Actions tab
  workflow_dispatch:

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  generate-and-email-report:
    name: Generate fresh PDF from the cloud database and email it
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The app always reads the connection string from DATABASE_URL.
      # Point the GitHub secret at the Supabase (cloud) database.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        run: |
          missing=0
          for s in DATABASE_URL EMAIL_USERNAME EMAIL_PASSWORD REPORT_RECIPIENT; do
            if [ -z "${!s}" ]; then echo "::error::Missing secret: $s"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "All required secrets are configured."
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          REPORT_RECIPIENT: ${{ secrets.REPORT_RECIPIENT }}

      - name: Verify cloud PostgreSQL connection
        run: |
          python - <<'PY'
          import sys
          from db.connection import check_database_connection
          ok, msg = check_database_connection()
          print("Connected to cloud PostgreSQL" if ok else f"Connection failed: {msg}")
          sys.exit(0 if ok else 1)
          PY

      - name: Generate a fresh PDF report from current data
        run: |
          rm -f reports/*.pdf
          python -m reports.generate_pdf_report --output reports/weekly_sales_report.pdf

      - name: Verify the PDF exists and is not empty
        run: |
          test -s reports/weekly_sales_report.pdf || { echo "::error::PDF missing or empty"; exit 1; }
          echo "PDF OK ($(wc -c < reports/weekly_sales_report.pdf) bytes)"

      - name: Report date
        id: meta
        run: echo "date=$(date -u '+%B %d, %Y')" >> "$GITHUB_OUTPUT"

      - name: Upload PDF as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-sales-report
          path: reports/weekly_sales_report.pdf
          retention-days: 30

      - name: Email the report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ secrets.SMTP_PORT || '465' }}
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Weekly Sales Analytics Report"
          to: ${{ secrets.REPORT_RECIPIENT }}
          from: "Sales Analytics Platform <${{ secrets.EMAIL_USERNAME }}>"
          html_body: |
            <h2>Weekly Sales Analytics Report</h2>
            <p>Generated ${{ steps.meta.outputs.date }} from the live PostgreSQL warehouse.</p>
            <p>The attached <b>weekly_sales_report.pdf</b> contains executive KPIs, dimensional
            breakdowns, the anomaly &amp; variance audit, the Ridge forecast and AI recommendations.</p>
            <hr><small>Sent automatically by GitHub Actions.</small>
          attachments: reports/weekly_sales_report.pdf

      - name: Summary
        if: always()
        run: echo "Weekly report workflow finished with status '${{ job.status }}'."
