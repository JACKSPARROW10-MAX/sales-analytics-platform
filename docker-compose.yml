services:
  postgres:
    image: postgres:16
    container_name: sales_platform_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sales_platform}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sales_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sales_platform_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sales-analytics-platform:latest
    container_name: sales_analytics_app
    restart: always
    env_file:
      - .env
    environment:
      # For local compose the app talks to the postgres service, not localhost.
      # Any DATABASE_URL in .env (e.g. Supabase) still takes precedence.
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    # Apply the schema (idempotent) before starting the API server.
    command: >
      sh -c "python init_db.py &&
             python -m gunicorn api.main:app -w 2 -k uvicorn.workers.UvicornWorker
             --bind 0.0.0.0:8000 --access-logfile - --timeout 120"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - prod

volumes:
  postgres_data:
